name: workbench3d
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # A LAN-accessible local test service, never intended for public exposure.
      - "${WB3D_BIND_ADDRESS:-0.0.0.0}:${WB3D_PORT:-8087}:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
