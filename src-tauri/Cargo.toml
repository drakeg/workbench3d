[package]
name = "workbench3d"
version = "0.1.0"
description = "Open-source push/pull 3D modeler"
authors = ["Workbench3D contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "workbench3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
