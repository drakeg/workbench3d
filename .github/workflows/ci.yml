name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end smoke test
        run: |
          npx vite preview --port 4173 &
          sleep 3
          CHROME_PATH=$(which google-chrome) node scripts/smoke.mjs http://localhost:4173/ .
          CHROME_PATH=$(which google-chrome) node scripts/smoke-platform.mjs http://localhost:4173/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: '*.png'
