name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Workflow files are valid
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck=
      - name: README badge consistency
        run: node scripts/validate-badges.mjs
      - name: Same version in package.json and Cargo
        run: node scripts/sync-version.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end smoke test
        run: |
          npx vite preview --port 4173 &
          sleep 3
          CHROME_PATH=$(which google-chrome) node scripts/smoke.mjs http://localhost:4173/ .
          CHROME_PATH=$(which google-chrome) node scripts/smoke-platform.mjs http://localhost:4173/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: '*.png'

  docker-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build and start LAN test image
        run: |
          WB3D_BIND_ADDRESS=127.0.0.1 WB3D_PORT=18887 docker compose up -d --build
      - name: Verify HTTP health and browser app
        run: |
          set -euo pipefail
          for n in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18887/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18887/healthz | grep -Fxq ok
          curl --fail --silent http://127.0.0.1:18887/ | grep -Eq '<html|<!doctype html' 
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test container
        if: always()
        run: WB3D_BIND_ADDRESS=127.0.0.1 WB3D_PORT=18887 docker compose down --remove-orphans
