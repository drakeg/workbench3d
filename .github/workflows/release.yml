# Automatic releases.
# Whenever main has a version in package.json that hasn't been released yet, this builds the
# installers (the native Mac app for Apple silicon; Windows and Linux with Tauri), creates the tag v<version>,
# and publishes the GitHub Release once every build has succeeded.
#
# To release: bump "version" in package.json (e.g. `npm version minor --no-git-tag-version`)
# in a PR and merge it. Nothing else to do. You can also run it by hand from the Actions tab.
name: Release desktop app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - name: Same version in package.json and Cargo
        run: node scripts/sync-version.mjs --check
      - id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: Workbench3D v${{ needs.version.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Download the installer for your system:
            - **Mac (Apple silicon, macOS 26 or later):** `Workbench3D_${{ needs.version.outputs.version }}_mac.dmg`, the native app
            - **Windows:** `Workbench3D_${{ needs.version.outputs.version }}_x64-setup.exe`
            - **Linux:** `.AppImage`, `.deb` or `.rpm`

            Mac: the app isn't notarized yet. The first time you open it, macOS blocks it; go to System Settings > Privacy & Security and click Open Anyway.
          # stays a draft until every platform has built, then the publish job makes it public
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The native Mac app (Swift, Metal), added to the draft release that the build jobs created.
  mac:
    needs: [version, build]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Build the app
        working-directory: mac
        run: APP_DIR=dist ./build.sh
      - name: The app's version matches the tag
        working-directory: mac
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          APP=$(plutil -extract CFBundleShortVersionString raw dist/Workbench3D.app/Contents/Info.plist)
          [[ "$APP" == "$VERSION" ]] || { echo "app says $APP, release is v$VERSION"; exit 1; }
      - name: Self-test
        working-directory: mac
        timeout-minutes: 5
        run: dist/Workbench3D.app/Contents/MacOS/Workbench3D --selftest
      - name: Make the disk image
        working-directory: mac
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dmg
          cp -R dist/Workbench3D.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Workbench3D $VERSION" -srcfolder dmg -ov -format UDZO "Workbench3D_${VERSION}_mac.dmg"
      - name: Add it to the release
        working-directory: mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v$VERSION" "Workbench3D_${VERSION}_mac.dmg" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [version, build, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest --tag "v$VERSION" --target "$GITHUB_SHA"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[].name)'
