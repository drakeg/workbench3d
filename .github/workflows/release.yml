# Automatic releases.
# When main has a version that is not yet published, build Windows/Linux Tauri and native
# macOS installers, then publish only once all platforms succeed. A failed draft can be
# retried for the same commit/version without rewriting a release tag.
#
# To release: bump "version" in package.json (e.g. `npm version minor --no-git-tag-version`)
# in a PR and merge it. Nothing else to do. You can also run it by hand from the Actions tab.
name: Release desktop app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - name: Same version in package.json and Cargo
        run: node scripts/sync-version.mjs --check
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="v$VERSION"
          TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          if RELEASE_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$RELEASE_DRAFT" == "false" ]]; then
              echo "$TAG is already published; nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -z "$TAG_SHA" ]]; then
              echo "::error::Draft $TAG exists without a matching Git tag; investigate before retrying."
              exit 1
            fi
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::Draft $TAG points to $TAG_SHA, not $GITHUB_SHA. Refusing to mix commits."
              exit 1
            fi
            echo "Resuming unpublished draft $TAG at $GITHUB_SHA"
          elif [[ -n "$TAG_SHA" ]]; then
            echo "::error::Tag $TAG exists without a GitHub Release; investigate before retrying."
            exit 1
          else
            echo "Preparing new release $TAG at $GITHUB_SHA"
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: Workbench3D v${{ needs.version.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Download the installer for your system:
            - **Mac (Apple silicon, macOS 26 or later):** `Workbench3D_${{ needs.version.outputs.version }}_mac.dmg`, the native app
            - **Windows:** `Workbench3D_${{ needs.version.outputs.version }}_x64-setup.exe`
            - **Linux:** `.AppImage`, `.deb` or `.rpm`

            Mac: the app isn't notarized yet. The first time you open it, macOS blocks it; go to System Settings > Privacy & Security and click Open Anyway.
          # stays a draft until every platform has built, then the publish job makes it public
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The native Mac app (Swift, Metal), added to the draft release that the build jobs created.
  mac:
    needs: [version, build]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Build the app
        working-directory: mac
        run: APP_DIR=dist ./build.sh
      - name: The app's version matches the tag
        working-directory: mac
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          APP=$(plutil -extract CFBundleShortVersionString raw dist/Workbench3D.app/Contents/Info.plist)
          [[ "$APP" == "$VERSION" ]] || { echo "app says $APP, release is v$VERSION"; exit 1; }
      - name: Self-test
        working-directory: mac
        timeout-minutes: 5
        run: dist/Workbench3D.app/Contents/MacOS/Workbench3D --selftest
      - name: Make the disk image
        working-directory: mac
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dmg
          cp -R dist/Workbench3D.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Workbench3D $VERSION" -srcfolder dmg -ov -format UDZO "Workbench3D_${VERSION}_mac.dmg"
      - name: Add it to the release
        working-directory: mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v$VERSION" "Workbench3D_${VERSION}_mac.dmg" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [version, build, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Do not publish a draft with incomplete installers, even if jobs reported success.
          ASSETS=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          echo "$ASSETS" | grep -Eq '\.exe
 || { echo "::error::Missing Windows installer"; exit 1; }
          echo "$ASSETS" | grep -Eq '\.(AppImage|deb|rpm)
 || { echo "::error::Missing Linux installer"; exit 1; }
          echo "$ASSETS" | grep -Fxq "Workbench3D_${VERSION}_mac.dmg" || { echo "::error::Missing native macOS DMG"; exit 1; }
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest --tag "v$VERSION" --target "$GITHUB_SHA"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[].name)'
