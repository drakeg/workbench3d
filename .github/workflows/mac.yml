# Native Mac app (mac/): builds for Apple silicon, runs the engine tests, the in-app self-test,
# and takes snapshots of the window (uploaded as an artifact so changes can be reviewed).
name: Mac app
on:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/mac.yml']
  pull_request:
    paths: ['mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          swift --version
          sw_vers
          uname -m
      - name: Build (arm64)
        run: swift build -c release --arch arm64 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Engine tests
        run: swift test 2>&1 | tail -60; exit ${PIPESTATUS[0]}
      - name: Build the app bundle
        run: ./build.sh
      - name: Self-test
        timeout-minutes: 5
        run: tools/selftest.sh
      - name: Snapshots
        timeout-minutes: 5
        run: tools/snap.sh; ls -la /tmp/Workbench3D-shots
      - name: Snapshot previews in the log
        # Small copies of the window snapshots, base64 between markers, so reviewers (and agents)
        # that can't download artifacts can still look at them.
        if: always()
        run: |
          for f in /tmp/Workbench3D-shots/window-*.png; do
            [ -f "$f" ] || continue
            sips -Z 1000 -s format jpeg -s formatOptions 70 "$f" --out "/tmp/preview.jpg" >/dev/null
            echo "PREVIEW-BEGIN $(basename "$f" .png)"
            base64 -i /tmp/preview.jpg | fold -w 1000
            echo "PREVIEW-END"
          done
      - name: Crash reports
        if: failure()
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Workbench3D* 2>/dev/null | head -1); do
            echo "== $f"; python3 -c "import json,sys; t=open(sys.argv[1]).read().split('\n',1)[1]; d=json.loads(t); th=[x for x in d['threads'] if x.get('triggered')][0]; print(d.get('exception')); [print(fr.get('imageIndex'), d['usedImages'][fr['imageIndex']].get('name'), fr.get('symbol'), fr.get('sourceFile'), fr.get('sourceLine')) for fr in th['frames'][:40]]" "$f" || head -c 6000 "$f"
          done
      - name: Disk image (as the release makes it)
        run: |
          APP_DIR=dist ./build.sh
          mkdir -p dmg && cp -R dist/Workbench3D.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Workbench3D -srcfolder dmg -ov -format UDZO Workbench3D_test_mac.dmg
          ls -la Workbench3D_test_mac.dmg
          plutil -p dist/Workbench3D.app/Contents/Info.plist | grep -E "ShortVersion|DocumentTypes|wb3d"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-snapshots
          path: /tmp/Workbench3D-shots
          if-no-files-found: warn
