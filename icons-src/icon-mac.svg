<!-- macOS: the rounded square sits on Apple's 1024 grid (824 body, 100 margin) so it matches other Dock icons -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3946"/>
      <stop offset="1" stop-color="#161d24"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#s)"/>
  <g transform="translate(100 100) scale(1.609)" stroke-linejoin="round" stroke-width="14" stroke="#10151a">
    <path d="M86 300 L300 176 L426 248 L212 372 Z" fill="#e3c58f"/>
    <path d="M86 300 L212 372 L212 412 L86 340 Z" fill="#b98d55"/>
    <path d="M212 372 L426 248 L426 288 L212 412 Z" fill="#a67a45"/>
    <path d="M300 176 L300 96" stroke="#5fa8ff" stroke-width="22" stroke-linecap="round"/>
    <path d="M262 132 L300 92 L338 132" fill="none" stroke="#5fa8ff" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
